<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<h3>Donor Information</h3>

<form>

<table>

<tr>
<td><label for="fname">First Name*</label></td>
<td><input type="text" id="fname" name="fname" required></td>
</tr>

<tr>
<td><label for="lname">Last Name*</label></td>
<td><input type="text" id="lname" name="lname" required></td>
</tr>

<tr>
<td><label for="company">Company</label></td>
<td><input type="text" id="company" name="company"></td>
</tr>

<tr>
<td><label for="address1">Address 1*</label></td>
<td><input type="text" id="address1" name="address1" required></td>
</tr>

<tr>
<td><label for="address2">Address 2</label></td>
<td><input type="text" id="address2" name="address2"></td>
</tr>

<tr>
<td><label for="city">City*</label></td>
<td><input type="text" id="city" name="city" required></td>
</tr>

<tr>
<td><label for="state">State*</label></td>
<td>
<select id="state" name="state" required>
<option value="">Select a State</option>
<option>Cumilla</option>
<option>Khulna</option>
<option>Rajshahi</option>
</select>
</td>
</tr>

<tr>
<td><label for="zip">Zip Code*</label></td>
<td><input type="text" id="zip" name="zip" required></td>
</tr>

<tr>
<td><label for="country">Country*</label></td>
<td>
<select id="country" name="country" required>
<option value="">Select a Country</option>
<option>Bangladesh</option>
<option>Canada</option>
<option>Australia</option>
</select>
</td>
</tr>

<tr>
<td><label for="phone">Phone</label></td>
<td><input type="tell" id="phone" name="phone"></td>
</tr>

<tr>
<td><label for="fax">Fax</label></td>
<td><input type="tell" id="fax" name="fax"></td>
</tr>

<tr>
<td><label for="email">Email*</label></td>
<td><input type="email" id="email" name="email" required></td>
</tr>

<tr>
<td>Donation Amount*</td>
<td>
<label><input type="radio" name="amount" value="None">None</label>
<label><input type="radio" name="amount" value="50">$50</label>
<label><input type="radio" name="amount" value="75">$75</label>
<label><input type="radio" name="amount" value="100">$100</label>
<label><input type="radio" name="amount" value="250">$250</label>
<label><input type="radio" name="amount" value="Other">Other</label>
</td>
</tr>

<tr>
<td><label for="other">Other Amount $</label></td>
<td><input type="number" id="other" name="other"></td>
</tr>

<tr>
<td>Recurring Donation</td>
<td>
<label>
<input type="checkbox" name="recurring">
I am interested in giving on a regular basis.
</label>
</td>
</tr>

<tr>
<td><label for="monthly">Monthly Credit Card $</label></td>
<td>
<input type="number" id="monthly" name="monthly">
<label for="months">For</label>
<input type="number" id="months" name="months">
Months
</td>
</tr>

</table>

<h3>Honorarium and Memorial Donation Information</h3>

<table>

<tr>
<td>I would like to make this donation</td>
<td>
<label><input type="radio" name="donation" value="honor">To Honor</label><br>
<label><input type="radio" name="donation" value="memory">In Memory of</label>
</td>
</tr>

<tr>
<td><label for="memname">Name</label></td>
<td><input type="text" id="memname" name="memname"></td>
</tr>

<tr>
<td><label for="acknowledge">Acknowledge Donation to</label></td>
<td><input type="text" id="acknowledge" name="acknowledge"></td>
</tr>

<tr>
<td><label for="memaddress">Address</label></td>
<td><input type="text" id="memaddress" name="memaddress"></td>
</tr>

<tr>
<td><label for="memcity">City</label></td>
<td><input type="text" id="memcity" name="memcity"></td>
</tr>

<tr>
<td><label for="memstate">State</label></td>
<td>
<select id="memstate" name="memstate">
<option>Select a State</option>
<option>Cumilla</option>
<option>Khulna</option>
</select>
</td>
</tr>

<tr>
<td><label for="memzip">Zip</label></td>
<td><input type="text" id="memzip" name="memzip"></td>
</tr>

</table>



<input type="reset" value="Reset">
<input type="submit" value="Continue">

</form>
</body>
</html>
